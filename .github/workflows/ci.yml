name: protocol-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Must match `channel` in rust-toolchain.toml. The action does not read
      # that file, so the version is stated here too; if one moves, move both.
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Simulator
        run: cargo run -p world-simulator
